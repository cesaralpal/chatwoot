      - key: SECRET_KEY_BASE
        value: "b926ea5529c267a4da5df97e4eb4ef29"
      - key: MAILER_SENDER_EMAIL
        value: "jcesarap1@gmail.com"
      - key: SMTP_ADDRESS
        value: "smtp.gmail.com"
      - key: SMTP_DOMAIN
        value: "gmail.com"
      - key: SMTP_ENABLE_STARTTLS_AUTO
