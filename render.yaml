      - key: SECRET_KEY_BASE
        value: "b926ea5529c267a4da5df97e4eb4ef29"
    dockerCommand: "bundle exec sidekiq -C config/sidekiq.yml"

databases:
  - name: chatwoot-postgres
    databaseName: chatwoot
    user: chatwoot

redis:
  - name: chatwoot-redis
