    # corre migraciones/seeds antes de publicar
    preDeployCommand: "bundle exec rails db:chatwoot_prepare"

  - type: worker
    name: chatwoot-worker
    runtime: image
    image:
      url: ghcr.io/chatwoot/chatwoot:latest
    autoDeploy: true
    envVars:
      - key: WORKER
        value: "1"              # esto hace que la imagen ejecute Sidekiq
      - key: RAILS_ENV
        value: production
      - key: RACK_ENV
        value: production
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: "postgresql://chatwootdb:UhHffcISk9H1Mvja6LrS4it0PN5EktXS@dpg-d3cafd8gjchc7391erp0-a/chatwootdb_w8y7"
